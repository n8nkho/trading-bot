# Fortress runtime config (declarative \"B\" layer).
# Copy to fortress_runtime.yaml and edit, or set FORTRESS_RUNTIME_CONFIG to a path.
# Risk/screening limits: see policy_profiles.json + TRADING_POLICY_PROFILE.

version: 1

agents:
  daily_screen:
    enabled: true
  position_monitor:
    enabled: true
  intraday_sniper:
    enabled: true
  spy_intraday_swing:
    enabled: true
    default_equity_usd: 20000
  fortress:
    enabled: true
  headline_event:
    enabled: true
  meta_architect:
    enabled: true

defaults:
  # Used when orchestrator screen/snipe omit portfolio arg and env vars unset
  portfolio_value_usd: 20000

llm:
  # provider: none | ollama | deepseek  (advisory only; execution stays deterministic)
  provider: none
  # Oracle VM: Ollama often on localhost:11434
  ollama_base_url: http://127.0.0.1:11434
  default_model: llama3.2:3b
  # Optional DeepSeek (OpenAI-compatible endpoint)
  deepseek_base_url: https://api.deepseek.com/v1
  deepseek_model: deepseek-chat
  # Prefer env var in production; inline key is optional for testing only.
  deepseek_api_key: ""
