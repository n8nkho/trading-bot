<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 Fortress Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 border border-white/20">
            <h1 class="text-4xl font-bold text-white mb-8">🏰 Fortress Command Center</h1>
            
            <div class="grid grid-cols-4 gap-6 mb-8">
                <div class="bg-white/10 rounded-xl p-6">
                    <div class="text-white/70 text-sm mb-2">Today</div>
                    <div class="text-2xl font-bold text-white">$0.00</div>
                    <div class="text-sm text-white/50">0.00%</div>
                </div>
                <div class="bg-white/10 rounded-xl p-6">
                    <div class="text-white/70 text-sm mb-2">This Week</div>
                    <div class="text-2xl font-bold text-white">$0.00</div>
                    <div class="text-sm text-white/50">0.00%</div>
                </div>
                <div class="bg-white/10 rounded-xl p-6">
                    <div class="text-white/70 text-sm mb-2">This Month</div>
                    <div class="text-2xl font-bold text-white">-$9.87</div>
                    <div class="text-sm text-red-300">-0.10%</div>
                </div>
                <div class="bg-white/10 rounded-xl p-6">
                    <div class="text-white/70 text-sm mb-2">All Time</div>
                    <div class="text-2xl font-bold text-white">-$9.87</div>
                    <div class="text-sm text-red-300">-0.10%</div>
                </div>
            </div>

            <div class="bg-white/10 rounded-xl p-6 mb-8">
                <h2 class="text-xl font-bold text-white mb-4">💰 Strategy Performance</h2>
                <table class="w-full text-white">
                    <thead>
                        <tr class="border-b border-white/20">
                            <th class="text-left py-3">Strategy</th>
                            <th class="text-right py-3">P&L</th>
                            <th class="text-right py-3">Trades</th>
                            <th class="text-right py-3">Win Rate</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-white/10">
                            <td class="py-3">📈 Stocks</td>
                            <td class="text-right text-red-300">-$9.87</td>
                            <td class="text-right">1</td>
                            <td class="text-right">0%</td>
                        </tr>
                        <tr class="border-b border-white/10">
                            <td class="py-3">💱 Forex</td>
                            <td class="text-right">$0.00</td>
                            <td class="text-right">0</td>
                            <td class="text-right">-</td>
                        </tr>
                        <tr class="border-b border-white/10">
                            <td class="py-3">🎯 Options</td>
                            <td class="text-right">$0.00</td>
                            <td class="text-right">0</td>
                            <td class="text-right">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="bg-white/10 rounded-xl p-6">
                <h2 class="text-xl font-bold text-white mb-4">📊 Market Conditions</h2>
                <div class="grid grid-cols-3 gap-6 text-white">
                    <div>
                        <div class="text-white/70 text-sm">VIX</div>
                        <div class="text-2xl font-bold">21.01</div>
                    </div>
                    <div>
                        <div class="text-white/70 text-sm">Regime</div>
                        <div class="text-2xl font-bold">NEUTRAL</div>
                    </div>
                    <div>
                        <div class="text-white/70 text-sm">USD</div>
                        <div class="text-2xl font-bold">97.70</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
