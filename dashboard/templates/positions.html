{% extends "base.html" %}
{% block content %}
<h1>Open Positions</h1>
<table class="table table-dark">
<tr><th>Ticker</th><th>Entry</th><th>Current</th><th>P&L</th></tr>
{% for p in positions %}
<tr><td>{{ p.ticker }}</td><td>${{ p.entry }}</td><td>${{ p.current }}</td><td>{{ p.pnl }}</td></tr>
{% endfor %}
</table>
{% endblock %}
