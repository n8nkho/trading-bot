name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create venv and install
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt
      - name: End-to-end before deploy
        run: ./scripts/e2e_before_deploy.sh
